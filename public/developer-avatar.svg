  </defs>
  
  <!-- Outer Card Frame -->
  <rect x="20" y="20" width="560" height="560" rx="32" fill="url(#grad1)" stroke="#1b1b1b" stroke-width="4" />
  <rect x="36" y="36" width="528" height="528" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  
