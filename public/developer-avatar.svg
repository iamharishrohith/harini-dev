  <!-- Hair styling -->
  <path d="M210 220 Q210 130 300 130 Q390 130 390 220 Q390 280 375 320 Q365 240 350 200 Q300 180 250 200 Q235 240 225 320 Q210 280 210 220 Z" fill="#334155" />
