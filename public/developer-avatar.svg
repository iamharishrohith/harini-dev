  <ellipse cx="300" cy="225" rx="55" ry="65" fill="#fed7aa" />
  <!-- Glasses -->
  <circle cx="275" cy="215" r="20" fill="none" stroke="#4f46e5" stroke-width="5" />
  <circle cx="325" cy="215" r="20" fill="none" stroke="#4f46e5" stroke-width="5" />
  <line x1="295" y1="215" x2="305" y2="215" stroke="#4f46e5" stroke-width="5" />
  <!-- Smile -->
  <path d="M285 255 Q300 270 315 255" fill="none" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round" />
