    <text x="95" y="29" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1b1b1b" text-anchor="middle">AI Systems Architect</text>
  </g>
  
  <g transform="translate(370, 360)">
    <rect width="160" height="46" rx="12" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.5" />
    <rect x="20" y="17" width="12" height="12" rx="3" fill="#06b6d4" />
    <text x="95" y="29" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#4f46e5" text-anchor="middle">&lt;FDE Engine /&gt;</text>
